:["1 · Tension","Frustration is visible, but the issue has not turned into repeated arguments or personal attacks.","A colleague sounds annoyed; a meeting becomes uncomfortable but respectful."],"ar":["١ · التوتر","يظهر الانزعاج، لكن الخلاف لم يتحول بعد إلى جدالات متكررة أو هجوم شخصي.","يبدو أحد الزملاء منزعجاً؛ ويصبح الاجتماع غير مريح لكنه يظل محترماً."]},"2":{"en":["2 · Repeated arguments","The debate keeps returning and each side focuses on winning rather than understanding.","The same dispute restarts every morning; both repeat their positions without listening."],"ar":["٢ · الجدال المتكرر","يتجدد النقاش مراراً ويركز كل طرف على الانتصار بدلاً من الفهم.","يعود الخلاف كل صباح؛ ويكرر الطرفان موقفيهما من دون استماع."]},"3":{"en":["3 · Personal blame","The conversation moves from discussing the issue to attacking someone's character, competence or intentions.","'You are the problem'; 'You always ruin everything.'"],"ar":["٣ · اللوم الشخصي","ينتقل الحديث من المشكلة إلى مهاجمة شخصية شخص أو كفاءته أو نواياه.","«أنت المشكلة»؛ «أنت دائماً تفسد كل شيء»."]},"4":{"en":["4 · Camps & obstruction","People recruit allies, exclude others, withhold information or obstruct work.","Two camps stop sharing updates; a group deliberately blocks the other's tasks."],"ar":["٤ · التحزبات والعرقلة","يشكل الأشخاص تحالفات أو يستبعدون الآخرين أو يحجبون المعلومات أو يعرقلون العمل.","مجموعتان تتوقفان عن مشاركة التحديثات؛ أو تعرقل إحداهما مهام الأخرى عمداً."]},"5":{"en":["5 · Threats or harm","The conflict includes intimidation, threats of retaliation, or actual harm. Threats require prompt intervention.","'I will make you pay'; a colleague threatens someone's safety or job in retaliation."],"ar":["٥ · التهديد أو الأذى","يشمل الخلاف التخويف أو التهديد بالانتقام أو الضرر الفعلي، ويتطلب التهديد تدخلاً سريعاً.","«سأجعلك تدفع الثمن»؛ أو يهدد زميل سلامة شخص أو وظيفته انتقاماً منه."]},"task":{"en":["Task conflict","A disagreement about the content of the work: ideas, facts, solutions or decisions.","Tw gitimate objective.","Sales prioritizes speed while Quality protects compliance; Finance wants cost reduction while Operations needs capacity."],"ar":["تضارب الأهداف","تسعى الأقسام إلى أولويات متعارضة رغم أن لكل قسم هدفاً مشروعاً.","المبيعات تركز على السرعة والجودة على الامتثال؛ المالية تخفض الكلفة بينما العمليات تحتاج إلى طاقة تشغيلية."]},"styles":{"en":["Different work & communication styles","Differences in pace, detail, tone, decision making or preferred channels create friction.","One manager expects fast phone calls; another requires detailed emails. One prefers quick decisions; another reviews every detail."],"ar":["اختلاف أساليب العمل والتواصل","اختلاف السرعة أو مستوى التفاصيل أو نبرة الحديث أو اتخاذ القرار أو قنوات التواصل يخلق توتراً.","مدير يفضل اتصالاً سريعاً وآخر يطلب بريداً مفصلاً؛ أحدهما يقرر بسرعة والآخر يراجع كل التفاصيل."]},"stress":{"en":["Stress & burnout","Heavy workload, fatigue and sustained pressure reduce patience and increase emotional reactions.","After many night shifts a team snaps over small requests; overloaded colleagues interpret neutral messages negatively."],"ar":["الضغط والاحتراق الوظيفي","تؤدي أعباء العمل والإرهاق والضغط المستمر إلى انخفاض الصبر وزيادة ردود الفعل الانفعالية.","بعد مناوبات ليلية متكررة ينفعل الفريق لأسباب بسيطة؛ ويفسر المرهقون الرسائل المحايدة بصورة سلبية."]}};

function renderFeedback(){const score=answers.filter(a=>a.correct).length;E("feedbackTag").textContent=L("tally");E("score").innerHTML=score+'<small> / 14</small>';E("scoreMessage").textContent=score===14?L("all"):L("partial");E("breakdown").innerHTML="";for(const cat of ["type","cause","level"]){const arr=answers.filter(a=>a.item.cat===cat);const v=arr.filter(a=>a.correct).length;const card=node("div","info");card.appendChild(node("strong","",L(cat)));card.appendChild(node("p","",v+" / "+arr.length));E("breakdown").appendChild(card)}const list=E("reviewList");list.innerHTML="";answers.forEach((a,i)=>{const wrap=node("div","review");wrap.appendChild(node("div","micro",L(a.item.cat+"Label")+" · "+(i+1)));wrap.appendChild(node("p","",a.item[lang]));wrap.appendChild(node("p",a.correct?"correct":"incorrect",a.correct?"✓ "+L("good"):"✕ "+L("needs")));wrap.appendChild(node("p","",L("your")+": "+name(a.choice)));wrap.appendChild(node("p","",L("correct")+": "+name(a.item.answer)));const box=node("div","learn"+(a.correct?"":" warn"));box.appendChild(node("strong","",a.correct?L("learn"):L("needs")));if(!a.correct){box.appendChild(node("strong","",lang==="ar"?"١. لماذا إجابتك غير صحيحة؟":"1. Why your choice is not correct"));box.appendChild(node("p","",wrongReason(a)));box.appendChild(node("strong","",lang==="ar"?"٢. لماذا الإجابة الصحيحة هي الأنسب؟":"2. Why the correct answer fits"));box.appendChild(node("p","",correctReason(a)))}box.appendChild(node("p","",C[a.item.answer][lang][1]));box.appendChild(node("strong","",L("examples")));box.appendChild(node("p","",C[a.item.answer][lang][2]));wrap.appendChild(box);list.appendChild(wrap)})}
