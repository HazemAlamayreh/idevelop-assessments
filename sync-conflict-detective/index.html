بصبرهم ينفعلون عند الطلبات البسيطة."},{"cat":"level","answer":"0","en":"Two teams have different opinions, ask respectful questions, and agree to test both approaches together.","ar":"فريقان لديهما رأيان مختلفان، يطرحان أسئلة باحترام ويتفقان على تجربة الطريقتين معاً."},{"cat":"level","answer":"1","en":"A colleague feels irritated after a meeting and says, 'This is getting frustrating,' but still speaks respectfully.","ar":"يشعر موظف بالانزعاج بعد اجتماع ويقول: «هذا الأمر بدأ يزعجني»، لكنه ما زال يتحدث باحترام."},{"cat":"level","answer":"2","en":"The same disagreement resurfaces every day. Both colleagues keep arguing, determined to prove they are right.","ar":"يتكرر الخلاف نفسه يومياً، ويواصل الزميلان الجدال مع إصرار كل منهما على إثبات أنه على حق."},{"cat":"level","answer":"3","en":"During a dispute, one colleague says, 'You are incompetent. You always ruin everything,' instead of discussing the work.","ar":"أثناء الخلاف، يقول موظف لزميله: «أنت غير كفؤ، ودائماً تفسد كل شيء» بدلاً من مناقشة العمل."},{"cat":"level","answer":"4","en":"Two groups take sides in an argument, exclude one another from updates, and intentionally block shared work.","ar":"ينقسم الموظفون إلى مجموعتين متعارضتين، ويتوقفون عن مشاركة التحديثات ويعرقلون العمل المشترك عمداً."},{"cat":"level","answer":"5","en":"A colleague threatens another: 'I will make you pay for this,' after their dispute escalates.","ar":"يهدد موظف زميله قائلاً: «سأجعلك تدفع ثمن هذا»، بعد تصاعد الخلاف بينهما."}];const KEYS={"type":["task","process","relationship"],"cause":["role","resources","goals","styles","stress"],"level":["0","1","2","3","4","5"]};const D={"en":{"title":"SYNC · Conflict Detective","sub":"WORKPLACE CONFLICT LAB","lang":"العربية","hero":"Can you decode workplace conflict?","lede":"14 mixed workplace situations. For each, identify the conflict type, organizational root cause, or escalation level. One question at a time, no timer.","start":"Start challenge","introTitle":"Your quick reference","type":"Conflict type","cause":"Organizational root cause","level":"Escalation level","typeHelp":"What are people disagreeing about? Task = ideas or decisions; Process = roles or methods; Relationship = interpersonal trust or respect.","causeHelp":"Why does the system create friction? Unclear roles, scarce resources, conflicting goals, different styles, or stress and burnout.","levelHelp":"How are people behaving now? The ladder moves from cooperation (0), through tension (1), repeated arguments (2), personal blame (3), camps and obstruction (4), to threats or harm (5).","tip":"Some situations overlap. Choose the clearest, most directly supported answer.","question":"Situation","progress":"Question","of":"of","choose":"Choose one answer","next":"Next question","results":"See my results","feedback":"Your learning feedback","score":"Correct answers","explanation":"Why this answer?","your":"Your choice","correct":"Correct answer","good":"Correct","review":"Review every situation","needs":"You need to know more about this","learn":"Learning insight","examples":"More examples","complete":"Mark as Complete","completed":"Learning completed!","again":"Play again","wrong":"Needs review","all":"Great work! Review the explanations to strengthen your understanding.","partial":"Review the highlighted concepts below. Learning the difference between a conflict's type, root cause and escalation stage will improve your diagnosis.","category":"Category","typeLabel":"TYPE","causeLabel":"ROOT CAUSE","levelLabel":"ESCALATION","typeTitle":"3 conflict types","causeTitle":"5 organizational causes","levelTitle":"6 escalation levels (0–5)","doneText":"You completed all 14 questions and reviewed the learning feedback.","tally":"Learning progress"},"ar":{"title":"SYNC · محقق الخلافات","sub":"مختبر خلافات بيئة العمل","lang":"English","hero":"هل تستطيع تشخيص الخلاف في العمل؟","lede":"١٤ موقفاً متنوعاً من بيئة العمل. حدّد نوع الخلاف أو سببه التنظيمي أو مستوى تصعيده. سؤال واحد في كل مرة، من دون مؤقت.","start":"ابدأ التحدي","introTitle":"دليلك السريع","type":"نوع الخلاف","cause":"السبب التنظيمي الجذري","level":"مستوى التصعيد","typeHelp":"حول ماذا يختلف الأشخاص؟ المهام: أفكار أو قرارات؛ الإجراءات: أدوار أو أساليب عمل؛ العلاقات: ثقة أو احترام بين الأشخاص.","causeHelp":"ما العامل التنظيمي الذي يسبب الاحتكاك؟ غموض الأدوار، نقص الموارد، تضارب الأهداف، اختلاف أساليب العمل أو التواصل، الضغط والاحتراق الوظيفي.","levelHelp":"كيف يتصرف الأشخاص الآن؟ يبدأ السلم بالتعاون (0)، ثم التوتر (1)، والجدال المتكرر (2)، واللوم الشخصي (3)، والتحزبات والعرقلة (4)، والتهديد أو الأذى (5).","tip":"قد تتداخل الأسباب، لذلك اختر التفسير الأوضح والأكثر دعماً من تفاصيل الموقف.","question":"الموقف","progress":"السؤال","of":"من","choose":"اختر إجابة واحدة","next":"السؤال التالي","results":"عرض نتيجتي","feedback":"التغذية الراجعة التعليمية","score":"الإجابات الصحيحة","explanation":"لماذا هذه الإجابة؟","your":"إجابتك","correct":"الإجابة الصحيحة","good":"صحيح","review":"راجع جميع المواقف","needs":"تحتاج لمعرفة المزيد عن هذا المفهوم","learn":"معلومة تعليمية","examples":"أمثلة إضافية","complete":"تحديد التدريب كمكتمل","completed":"اكتمل التعلّم!","again":"العب مرة أخرى","wrong":"بحاجة للمراجعة","all":"أحسنت! راجع الشروحات لتثبيت الفهم.","partial":"راجع المفاهيم المحددة أدناه. التمييز بين نوع الخلاف وسببه ومستوى التصعيد يساعدك على تشخيصه بصورة أدق.","category":"التصنيف","typeLabel":"النوع","causeLabel":"السبب الجذري","levelLabel":"التصعيد","typeTitle":"٣ أنواع من الخلاف","causeTitle":"٥ أسباب تنظيمية","levelTitle":"٦ مستويات تصعيد (٠–٥)","doneText":"أكملت جميع الأسئلة الأربعة عشر وراجعت التغذية الراجعة.","tally":"تقدمك التعليمي"}};const C={"0":{"en":["0 · Cooperation","Different viewpoints are discussed constructively. People listen and work toward a shared solution.","Both teams test ideas together; colleagues ask questions without blame."],"ar":["٠ · التعاون","تُناقش وجهات النظر المختلفة بشكل بنّاء، ويستمع الأشخاص لبعضهم ويعملون لحل مشترك.","يجرب الفريقان الأفكار معاً؛ ويطرح الزملاء أسئلة من دون لوم."]},"1":{"en":["1 · Tension","Frustration is visible, but the issue has not turned into repeated arguments or personal attacks.","A colleague sounds annoyed; a meeting becomes uncomfortable but respectful."],"ar":["١ · التوتر","يظهر الانزعاج، لكن الخلاف لم يتحول بعد إلى جدالات متكررة أو هجوم شخصي.","يبدو أحد الزملاء منزعجاً؛ ويصبح الاجتماع غير مريح لكنه يظل محترماً."]},"2":{"en":["2 · Repeated arguments","The debate keeps returning and each side focuses on winning rather than understanding.","The same dispute restarts every morning; both repeat their positions without listening."],"ar":["٢ · الجدال المتكرر","يتجدد النقاش مراراً ويركز كل طرف على الانتصار بدلاً من الفهم.","يعود الخلاف كل صباح؛ ويكرر الطرفان موقفيهما من دون استماع."]},"3":{"en":["3 · Personal blame","The conversation moves from discussing the issue to attacking someone's character, competence or intentions.","'You are the problem'; 'You always ruin everything.'"],"ar":["٣ · اللوم الشخصي","ينتقل الحديث من المشكلة إلى مهاجمة شخصية شخص أو كفاءته أو نواياه.","«أنت المشكلة»؛ «أنت دائماً تفسد كل شيء»."]},"4":{"en":["4 · Camps & obstruction","People recruit allies, exclude others, withhold information or obstruct work.","Two camps stop sharing updates; a group deliberately blocks the other's tasks."],"ar":["٤ · التحزبات والعرقلة","يشكل الأشخاص تحالفات أو يستبعدون الآخرين أو يحجبون المعلومات أو يعرقلون العمل.","مجموعتان تتوقفان عن مشاركة التحديثات؛ أو تعرقل إحداهما مهام الأخرى عمداً."]},"5":{"en":["5 · Threats or harm","The conflict includes intimidation, threats of retaliation, or actual harm. Threats require prompt intervention.","'I will make you pay'; a colleague threatens someone's safety or job in retaliation."],"ar":["٥ · التهديد أو الأذى","يشمل الخلاف التخويف أو التهديد بالانتقام أو الضرر الفعلي، ويتطلب التهديد تدخلاً سريعاً.","«سأجعلك تدفع الثمن»؛ أو يهدد زميل سلامة شخص أو وظيفته انتقاماً منه."]},"task":{"en":["Task conflict","A disagreement about the content of the work: ideas, facts, solutions or decisions.","Two pharmacists disagree on the strongest evidence; two teams advocate different campaign strategies."],"ar":["خلاف المهام","اختلاف حول مضمون العمل: الأفكار أو الحقائق أو الحلول أو القرارات.","صيدليان يختلفان حول الدليل العلمي الأقوى؛ فريقان يقترحان استراتيجيتين مختلفتين للحملة."]},"process":{"en":["Process conflict","A disagreement about how work gets done: responsibilities, sequence, methods, approvals or timing.","Who must approve the purchase? Which department prepares the first draft?"],"ar":["خلاف الإجراءات","اختلاف حول كيفية تنفيذ العمل: المسؤوليات أو التسلسل أو الأساليب أو الاعتمادات أو المواعيد.","من يعتمد عملية الشراء؟ وأي قسم يُعدّ المسودة الأولى؟"]},"relationship":{"en":["Relationship conflict","Friction centered on interpersonal trust, respect, dislike, or communication history.","Two coworkers refuse to collaborate after personal insults; colleagues undermine each other despite clear tasks."],"ar":["خلاف العلاقات","توتر يتمحور حول الثقة أو الاحترام أو النفور أو تاريخ التواصل بين الأشخاص.","زميلان يرفضان التعاون بعد إساءات شخصية؛ موظفان يقلل كل منهما من الآخر رغم وضوح المهام."]},"role":{"en":["Role ambiguity","People do not know who owns a task, who makes the decision, or whose authority applies.","Two departments each expect the other to respond to a complaint; nobody knows who signs off a change."],"ar":["غموض الأدوار","عدم وضوح مالك المهمة أو صاحب القرار أو حدود الصلاحيات.","كل قسم يعتقد أن القسم الآخر مسؤول عن الشكوى؛ ولا أحد يعرف من يعتمد التغيير."]},"resources":{"en":["Resource scarcity","Teams compete for limited people, time, budget, equipment or information.","Two projects request the same analyst; departments compete for a single testing machine."],"ar":["ندرة الموارد","تنافس الفرق على موارد محدودة مثل الأشخاص أو الوقت أو الميزانية أو المعدات أو المعلومات.","مشروعان يحتاجان نفس المحلل؛ وقسمان يتنافسان على جهاز فحص واحد."]},"goals":{"en":["Conflicting goals","Departments pursue priorities that pull in different directions, even when each has a legitimate objective.","Sales prioritizes speed while Quality protects compliance; Finance wants cost reduction while Operations needs capacity."],"ar":["تضارب الأهداف","تسعى الأقسام إلى أولويات متعارضة رغم أن لكل قسم هدفاً مشروعاً.","المبيعات تركز على السرعة والجودة على الامتثال؛ المالية تخفض الكلفة بينما العمليات تحتاج إلى طاقة تشغيلية."]},"styles":{"en":["Different work & communication styles","Differences in pace, detail, tone, decision making or preferred channels create friction.","One manager expects fast phone calls; another requires detailed emails. One prefers quick decisions; another reviews every detail."],"ar":["اختلاف أساليب العمل والتواصل","اختلاف السرعة أو مستوى التفاصيل أو نبرة الحديث أو اتخاذ القرار أو قنوات التواصل يخلق توتراً.","مدير يفضل اتصالاً سريعاً وآخر يطلب بريداً مفصلاً؛ أحدهما يقرر بسرعة والآخر يراجع كل التفاصيل."]},"stress":{"en":["Stress & burnout","Heavy workload, fatigue and sustained pressure reduce patience and increase emotional reactions.","After many night shifts a team snaps over small requests; overloaded colleagues interpret neutral messages negatively."],"ar":["الضغط والاحتراق الوظيفي","تؤدي أعباء العمل والإرهاق والضغط المستمر إلى انخفاض الصبر وزيادة ردود الفعل الانفعالية.","بعد مناوبات ليلية متكررة ينفعل الفريق لأسباب بسيطة؛ ويفسر المرهقون الرسائل المحايدة بصورة سلبية."]}};
let lang="en",sequence=[],index=0,selected=null,answers=[],completed=false;
const E=id=>document.getElementById(id),L=k=>D[lang][k],name=k=>C[k][lang][0];
function shuffle(a){const b=[...a];for(let j=b.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[b[j],b[r]]=[b[r],b[j]]}return b}
function show(id){["intro","quiz","feedback","done"].forEach(k=>E(k).classList.toggle("hidden",k!==id));window.scrollTo({top:0,behavior:"smooth"})}
function paint(){document.documentElement.lang=lang;document.body.dir=lang==="ar"?"rtl":"ltr";document.title=L("title");E("subtitle").textContent=L("sub");E("language").textContent=L("lang");["hero","lede","introTitle","typeTitle","causeTitle","levelTitle","typeHelp","causeHelp","levelHelp","tip"].forEach(k=>E(k).textContent=L(k));E("start").textContent=L("start");E("choose").textContent=L("choose");E("feedbackTitle").textContent=L("feedback");E("reviewHeader").textContent=L("review");E("finish").textContent=L("complete");E("restart").textContent=L("again");if(!E("quiz").classList.contains("hidden"))renderQuestion();if(!E("feedback").classList.contains("hidden"))renderFeedback();if(!E("done").classList.contains("hidden"))renderDone()}
function begin(){sequence=shuffle(DATA);index=0;selected=null;answers=[];completed=false;show("quiz");renderQuestion()}
function renderQuestion(){const q=sequence[index];E("counter").textContent=L("progress")+" "+(index+1)+" "+L("of")+" "+sequence.length;E("bar").style.width=(index/sequence.length*100)+"%";E("topic").textContent=L(q.cat+"Label");E("scenario").textContent=q[lang];E("next").textContent=index===sequence.length-1?L("results"):L("next");E("next").disabled=selected===null;E("prompt").textContent=L("choose");E("choices").innerHTML="";KEYS[q.cat].forEach(k=>{const b=document.createElement("button");b.className="choice"+(selected===k?" selected":"");b.type="button";b.textContent=name(k);b.onclick=()=>{selected=k;E("next").disabled=false;renderQuestion()};E("choices").appendChild(b)})}
function advance(){if(selected===null)return;answers.push({item:sequence[index],choice:selected,correct:sequence[index].answer===selected});index++;selected=null;if(index>=sequence.length){show("feedback");renderFeedback()}else{renderQuestion()}}
function node(tag,cl,txt){const e=document.createElement(tag);if(cl)e.className=cl;if(txt!==undefined)e.textContent=txt;return e}
function renderFeedback(){const score=answers.filter(a=>a.correct).length;E("feedbackTag").textContent=L("tally");E("score").innerHTML=score+'<small> / 14</small>';E("scoreMessage").textContent=score===14?L("all"):L("partial");E("breakdown").innerHTML="";for(const cat of ["type","cause","level"]){const arr=answers.filter(a=>a.item.cat===cat);const v=arr.filter(a=>a.correct).length;const card=node("div","info");card.appendChild(node("strong","",L(cat)));card.appendChild(node("p","",v+" / "+arr.length));E("breakdown").appendChild(card)}const list=E("reviewList");list.innerHTML="";answers.forEach((a,i)=>{const wrap=node("div","review");wrap.appendChild(node("div","micro",L(a.item.cat+"Label")+" · "+(i+1)));wrap.appendChild(node("p","",a.item[lang]));wrap.appendChild(node("p",a.correct?"correct":"incorrect",a.correct?"✓ "+L("good"):"✕ "+L("needs")));wrap.appendChild(node("p","",L("your")+": "+name(a.choice)));wrap.appendChild(node("p","",L("correct")+": "+name(a.item.answer)));const box=node("div","learn"+(a.correct?"":" warn"));box.appendChild(node("strong","",a.correct?L("learn"):L("needs")));box.appendChild(node("p","",C[a.item.answer][lang][1]));box.appendChild(node("strong","",L("examples")));box.appendChild(node("p","",C[a.item.answer][lang][2]));wrap.appendChild(box);list.appendChild(wrap)})}
function renderDone(){E("doneText").textContent=L("completed");E("finalTally").textContent=L("doneText")+" "+answers.filter(a=>a.correct).length+" / 14"}
E("language").onclick=()=>{lang=lang==="en"?"ar":"en";paint()};E("start").onclick=begin;E("next").onclick=advance;E("finish").onclick=()=>{completed=true;show("done");renderDone()};E("restart").onclick=()=>{answers=[];selected=null;show("intro");paint()};paint();
</script></body></html>
