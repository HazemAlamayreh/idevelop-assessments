<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYNC · Module 2 Manager Area</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;color:#092552;background:radial-gradient(circle at top right,#e1f2ff,transparent 38%),#f5f8fc}main{max-width:1040px;margin:auto;padding:22px 16px 60px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #44b1e7;padding:0 0 13px}.logo{font-size:36px;font-weight:1000}.logo span{color:#cb1231}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.lang{padding:10px 17px;background:white;color:#092552;border:2px solid #b7d9ed;border-radius:12px;font-weight:800}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;background:#e5f0fa;border:1px solid #bfd9f0;border-radius:16px;padding:8px;margin-top:16px}.nav a{padding:17px 10px;text-align:center;text-decoration:none;background:white;color:#0c386b;font-weight:850;border-radius:11px;line-height:1.3}.nav a.active{background:#092c67;color:white}.card{margin-top:20px;padding:clamp(20px,4vw,39px);background:#fff;border:1px solid #dce9f4;border-radius:24px;box-shadow:0 13px 39px #052c5311}.hidden{display:none!important}.pill{display:inline-block;border-radius:99px;background:#e7f4ff;color:#0969ae;padding:9px 14px;font-size:13px;font-weight:900}h1{font-size:clamp(32px,5vw,50px);margin:18px 0;line-height:1.13}h1 em{font-style:normal;color:#ce1332}h2{font-size:20px}p{line-height:1.65}.help{background:#eff8ff;border-left:5px solid #218fdf;border-radius:12px;padding:16px 18px;margin:17px 0}.primary{background:#092d69;color:white;border:0;padding:15px 25px;border-radius:12px;font-size:16px;font-weight:850}.primary:hover:not(:disabled){background:#c81031}.options{display:grid;gap:12px}.option{border:2px solid #d8e4f0;border-radius:13px;background:white;padding:15px 18px;text-align:start;color:#0b2c59;font-size:15px;font-weight:700;line-height:1.5}.option.selected{border-color:#146bc1;background:#e8f5ff}.option.right{border-color:#18985e;background:#edfff4}.option.wrong{border-color:#c31334;background:#fff0f3}.scenario{font-weight:850;font-size:clamp(19px,2.7vw,26px);line-height:1.5;margin:22px 0}.bar{background:#e4eef8;height:9px;border-radius:30px;margin:18px 0}.fill{background:#329de4;height:100%;border-radius:30px}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:20px}.score{font-size:70px;font-weight:1000}.summary{padding:15px;border:1px solid #dce9f3;border-radius:13px;margin:12px 0}.rise{animation:rise .35s ease-out}@keyframes rise{from{opacity:.2;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}body[dir=rtl] .help{border-left:0;border-right:5px solid #218fdf}@media(max-width:600px){.nav a{font-size:12px;padding:13px 6px}.row{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.rise{animation:none}}</style><style>.nav{grid-template-columns:repeat(4,minmax(0,1fr))}.nav a{font-size:clamp(11px,1.6vw,15px)}@media(max-width:500px){.nav{gap:4px;padding:5px}.nav a{padding:12px 3px;font-size:10px}}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

const DATA=[{"en":"A manager demands that an employee approve an annual MenaME appraisal by 5 PM. The employee refuses; they argue only about clicking Approve.","ar":"مدير يطلب من موظف اعتماد تقييم الأداء السنوي على MenaME قبل الخامسة، والموظف يرفض. يتجادلان فقط حول الضغط على زر الاعتماد.","options":[["They are debating underlying interests; raise the voice until the employee accepts.","هما يناقشان المصالح الحقيقية؛ ارفع الصوت حتى يقبل الموظف."],["They are stuck on positions; ask what concerns the employee about the appraisal text.","هما عالقان في مواقف سطحية؛ اسأل الموظف عمّا يقلقه في نص التقييم."],["They are being too cooperative; propose approving half of the appraisal.","يتعاونان بشكل مفرط؛ اقترح اعتماد نصف التقييم."],["They misused Pause–Notice–Choose; request HR to force a signature.","أساءا تطبيق توقف–لاحظ–اختر؛ اطلب من الموارد البشرية فرض التوقيع."]],"correct":1,"why":["The button is a position; the appraisal content may be the underlying concern. Ask about the reason before discussing the workflow.","الزر هو الموقف الظاهر؛ وقد يكون نص التقييم هو مصدر القلق. استكشف السبب قبل مناقشة خطوة النظام."]},{"en":"An employee demands a 15% salary raise, while the manager knows the authorized budget is capped at 5%. Uncomfortable with the employee's tone, the manager promises 10%.","ar":"موظف يطالب بزيادة راتب 15% رغم أن سقف الميزانية المعتمد 5%. ولإنهاء النقاش المزعج يعده المدير بزيادة 10%.","options":[["The manager accommodates under pressure; clarify constraints and explore feasible alternatives.","المدير يساير تحت الضغط؛ أوضح الحدود وابحث عن بدائل ممكنة."],["The manager competes excessively; avoid discussing compensation entirely.","المدير يتنافس بشكل مفرط؛ تجنب مناقشة التعويضات كلياً."],["The manager avoids the issue; agree to the full 15% increase.","المدير يتجنب الموضوع؛ وافق على زيادة 15% كاملة."],["The manager collaborates too much; insist on a zero increase.","المدير يبالغ في التعاون؛ أصر على عدم منح أي زيادة."]],"correct":0,"why":["Promising beyond authority to end discomfort is inappropriate Accommodating. Maintain the approved cap and explore legitimate alternatives without promising unapproved benefits.","الوعد بما يتجاوز الصلاحية لإنهاء التوتر مسايرة غير مناسبة. التزم بالسقف المعتمد وابحث عن بدائل مشروعة دون وعود غير معتمدة."]},{"en":"An L&D manager assigns Lein a comprehensive curriculum due in two days. Already overloaded with onboarding, Lein accepts silently, works until 2 AM, and feels resentful.","ar":"يكلف مدير التعلم والتطوير لين بإعداد منهج تدريبي شامل خلال يومين. لين مثقلة بمهام التهيئة، لكنها توافق بصمت وتعمل حتى الثانية صباحاً وتشعر بالاستياء.","options":[["Lein is competing; she should accommodate to preserve harmony.","لين تتنافس؛ عليها المسايرة للحفاظ على العلاقة."],["Lein is collaborating; she should avoid the workload.","لين تتعاون؛ عليها تجنب عبء العمل."],["Lein is accommodating; she should assert workload constraints and agree on a realistic deadline.","لين تساير؛ عليها التعبير بحزم عن ضغط العمل والاتفاق على موعد واقعي."],["Lein is avoiding; she should compromise only on content.","لين تتجنب؛ عليها التسوية فقط بشأن المحتوى."]],"correct":2,"why":["Silent acceptance despite an impossible workload reflects Accommodating. Discuss capacity, priority and a realistic schedule rather than silently absorbing the cost.","القبول الصامت رغم استحالة عبء العمل يعكس المسايرة. ناقش الطاقة المتاحة والأولويات والمدة الواقعية بدلاً من تحمل العبء بصمت."]},{"en":"An employee misses a mandatory compliance-learning deadline. Their manager assumes the employee is lazy and defiant and immediately issues a warning without asking why.","ar":"يتأخر موظف عن موعد تدريب امتثال إلزامي؛ فيفترض المدير أنه كسول ومتمرد ويصدر إنذاراً دون الاستفسار عن السبب.","options":[["Defiance is the fact; the missed deadline is merely a story; enforce compromise.","التمرد هو الحقيقة والتأخر مجرد تفسير؛ افرض تسوية."],["The missed deadline is a fact; laziness is an unverified story. Ask what happened first.","فوات الموعد حقيقة؛ والكسل تفسير غير متحقق منه. اسأل أولاً عما حدث."],["The manager accommodates too much; avoid discussing compliance.","المدير يساير كثيراً؛ تجنب مناقشة الامتثال."],["The manager collaborates too much; compete before checking facts.","المدير يتعاون كثيراً؛ احسم قبل التحقق من الوقائع."]],"correct":1,"why":["A deadline missed is observable; defiance is inferred. Establish facts first, then apply compliance rules consistently as needed.","عدم الالتزام بالموعد واقعة؛ أما التمرد فهو استنتاج. تحقق من الوقائع ثم طبق متطلبات الامتثال بعدل عند الحاجة."]},{"en":"A Talent Management Director argues for 45 minutes over a subordinate's font and border color on an internal agenda. The meeting is delayed.","ar":"يجادل مدير إدارة المواهب موظفاً لمدة 45 دقيقة حول الخط ولون إطار جدول أعمال داخلي، مما يؤخر الاجتماع.","options":[["The director overuses Competing for a minor detail; accommodate or let it go.","يبالغ المدير في التنافس حول تفصيل بسيط؛ ساير أو تجاوز الخلاف."],["The director overuses Avoiding; collaborate or compete harder.","يبالغ المدير في التجنب؛ تعاون أو تنافس بقوة أكبر."],["The director overuses Collaborating; compromise or compete instead.","يبالغ المدير في التعاون؛ استخدم التسوية أو التنافس."],["The director overuses Accommodating; avoid or collaborate instead.","يبالغ المدير في المسايرة؛ استخدم التجنب أو التعاون."]],"correct":0,"why":["For a low-stakes formatting preference, prolonged Competing wastes time and harms priorities. Flexibility is more proportionate.","في تفاصيل شكلية منخفضة الأهمية يستهلك التنافس المطول الوقت ويضر بالأولويات. المرونة أكثر ملاءمة."]},{"en":"During mid-year feedback, a manager unexpectedly criticizes an employee's communication with Production. The employee goes blank and cannot absorb the discussion.","ar":"أثناء مراجعة منتصف العام يقدم المدير ملاحظات سلبية غير متوقعة عن تواصل الموظف مع الإنتاج. يتجمد الموظف ولا يعود قادراً على استيعاب النقاش.","options":[["This is Flight; aggressively defend the communication style.","هذه استجابة هروب؛ دافع بشدة عن أسلوب التواصل."],["This is Fight; leave the room immediately.","هذه استجابة مواجهة؛ غادر الغرفة فوراً."],["This is Freeze; breathe and request a moment to process the feedback.","هذه استجابة تجمد؛ تنفس واطلب لحظة لاستيعاب الملاحظات."],["This is Freeze; agree forcefully with everything the manager says.","هذه استجابة تجمد؛ وافق بقوة على كل ما يقوله المدير."]],"correct":2,"why":["Going blank is characteristic of Freeze. A brief pause and a request to process information allow a more intentional response.","التوقف الذهني سمة لاستجابة التجمد. يساعد التوقف القصير وطلب فرصة للاستيعاب على الاستجابة بوعي."]},{"en":"Two senior specialists both insist they should lead a high-profile client presentation because of their seniority. The argument keeps repeating.","ar":"اختصاصيان كبيران يصر كل منهما على قيادة عرض لعميل مهم لأنه الأقدم. يتكرر الجدال بينهما دون تقدم.","options":[["They debate interests; raise voices until one accommodates.","هما يناقشان المصالح؛ ارفعوا الأصوات حتى يساير أحدهما."],["They are highly cooperative; immediately divide presentation time in half.","هما متعاونان جداً؛ اقتسموا وقت العرض فوراً."],["They misuse Pause–Notice–Choose; require a formal managerial order.","يسيئان تطبيق توقف–لاحظ–اختر؛ اطلب قراراً إدارياً رسمياً."],["They repeat positions; ask why leading this presentation matters to each person's goals.","يكرران مواقف سطحية؛ اسأل لماذا تهم قيادة العرض أهداف كل واحد منهما."]],"correct":3,"why":["Seniority claims are positions. Asking about desired recognition, experience or career goals reveals interests and expands potential solutions.","الاستناد إلى الأقدمية موقف معلن. السؤال عن التقدير والخبرة والأهداف المهنية يكشف المصالح ويفتح حلولاً متعددة."]},{"en":"A manager and director fundamentally disagree on next year's talent-assessment strategy. To avoid awkward check-ins, they leave it undiscussed for three months.","ar":"يختلف مدير ومدير أعلى حول استراتيجية تقييم المواهب للعام القادم، ويتجنبان مناقشتها ثلاثة أشهر لتجنب الإحراج.","options":[["Collaborating is overused on a minor issue; compromise instead.","هناك إفراط في التعاون حول موضوع بسيط؛ استخدم التسوية."],["Avoiding is overused on a strategic issue; collaborate to resolve it.","هناك إفراط في التجنب حول قضية استراتيجية؛ تعاونا لحلها."],["Accommodating is overused; immediately compete.","هناك إفراط في المسايرة؛ انتقل للتنافس فوراً."],["Competing is overused on a minor issue; accommodate instead.","هناك إفراط في التنافس حول موضوع بسيط؛ استخدم المسايرة."]],"correct":1,"why":["Long-term avoidance leaves a critical decision unresolved. Collaborating helps clarify concerns and agree on an actionable strategy.","التجنب الطويل يبقي قراراً مهماً دون حل. التعاون يساعد على توضيح المخاوف والاتفاق على استراتيجية قابلة للتنفيذ."]},{"en":"The CEO mandates an immediate freeze on non-essential spending. A manager schedules a two-hour discussion to decide whether the team should comply.","ar":"يصدر الرئيس التنفيذي قراراً فورياً بتجميد المصروفات غير الضرورية. يدعو مدير لاجتماع لساعتين لبحث ما إذا كان الفريق سيلتزم بالتوجيه.","options":[["Accommodating is overused; let the team decide whether to comply.","هناك إفراط في المسايرة؛ دع الفريق يقرر إن كان سيلتزم."],["Compromising is overused; accommodate employee preferences.","هناك إفراط في التسوية؛ ساير تفضيلات الموظفين."],["Competing is overused; postpone compliance for collaborative discussion.","هناك إفراط في التنافس؛ أجّل التنفيذ من أجل النقاش."],["Collaborating is misapplied to a non-negotiable urgent mandate; enforce it promptly.","التعاون غير ملائم لقرار عاجل وغير قابل للتفاوض؛ نفّذ التوجيه فوراً."]],"correct":3,"why":["Whether to obey an authorized urgent mandate is not up for team vote. Communicate and execute it promptly, while consulting on implementation where possible.","تنفيذ توجيه عاجل ومعتمد ليس موضوع تصويت. أوضح القرار ونفذه سريعاً، مع إمكان التشاور حول طريقة التنفيذ."]},{"en":"During a denied-promotion discussion, an employee becomes highly upset and raises their voice. The manager calmly pauses the conversation and schedules it for tomorrow morning.","ar":"أثناء مناقشة رفض ترقية، ينفعل الموظف ويرفع صوته. يوقف المدير الحوار بهدوء ويتفق على استكماله صباح الغد.","options":[["This is poor Avoiding; the manager must impose an immediate decision.","هذا تجنب سيئ؛ على المدير فرض قرار فوري."],["This is appropriate temporary Avoiding because emotions are too high for a productive discussion.","هذا تجنب مؤقت مناسب لأن الانفعالات مرتفعة ولا تسمح بحوار منتج."],["This is poor Accommodating; the manager must continue the heated conversation.","هذه مسايرة سيئة؛ يجب مواصلة النقاش المحتدم."],["This is appropriate Compromising because both share emotional costs.","هذه تسوية مناسبة لأن الطرفين يتقاسمان الكلفة الانفعالية."]],"correct":1,"why":["A time-bound break is a constructive use of Avoiding when emotions prevent meaningful dialogue; the agreed follow-up keeps the issue open.","الاستراحة المحددة بوقت استخدام بنّاء للتجنب عندما تعيق الانفعالات الحوار؛ والمتابعة المتفق عليها تمنع تجاهل المشكلة."]}];
const T={en:{subtitle:"CONFLICT RESPONSE STYLES",tag:"MODULE 2 · MANAGER AREA · 10 SCENARIOS",title:"Module 2: Manager–Employee Conflict Scenarios",desc:"This module moves from why conflict happens to how we respond. Learn to recognize automatic reactions and deliberately choose an appropriate response.",theory:"<b>Pause → Notice → Choose:</b> Stop your first reaction, notice your thoughts and feelings, and select a considered response.<br><b>Fact vs Story:</b> Separate observable facts from assumptions.<br><b>Five styles:</b> Competing, Avoiding, Accommodating, Compromising, and Collaborating. No style is always best: urgency, importance and available time matter.",method:"Answer 10 workplace scenarios. Each question tests the best diagnosis and correction. You will see teaching feedback immediately after each answer. No timer.",start:"Start Module 2",q:"Question",prompt:"Which option best identifies the mistake and appropriate response?",check:"Check answer",next:"Next question",finish:"See results",back:"Back",right:"Correct!",wrong:"Not quite.",correct:"Correct answer",why:"Why?",endtitle:"Module 2 Results",review:"Review",complete:"Mark as Complete",done:"Module 2 completed",replay:"Play again",tab1:"Module 1 – Introduction",tab2:"Module 2 – Review",tab3:"Self-Assessment",tab4:"Module 2 – Manager Questions"},ar:{subtitle:"أنماط الاستجابة للخلاف",tag:"الموديول الثاني · منطقة المدير · ١٠ مواقف",title:"الموديول الثاني: مواقف الخلاف بين المدير والموظف",desc:"ينتقل هذا الموديول من فهم أسباب الخلاف إلى كيفية الاستجابة له، وكيف نلاحظ ردود فعلنا التلقائية ونختار استجابة مناسبة.",theory:"<b>توقف ← لاحظ ← اختر:</b> أوقف رد الفعل الأول، لاحظ أفكارك ومشاعرك، ثم اختر استجابة واعية.<br><b>الحقيقة والتفسير:</b> ميّز بين المعلومة الملاحظة والافتراض.<br><b>الأساليب الخمسة:</b> التنافس، والتجنب، والمسايرة، والتسوية، والتعاون. لا يوجد أسلوب أفضل دائماً؛ يعتمد الاختيار على الإلحاح والأهمية والوقت.",method:"أجب عن ١٠ مواقف من بيئة العمل، وحدد التشخيص والتصرف الأنسب. تظهر التغذية الراجعة بعد كل إجابة، ولا يوجد مؤقت.",start:"ابدأ الموديول الثاني",q:"السؤال",prompt:"أي خيار يحدد الخطأ وأفضل طريقة لتصحيحه؟",check:"تحقق من الإجابة",next:"السؤال التالي",finish:"عرض النتائج",back:"السابق",right:"إجابة صحيحة!",wrong:"ليست الإجابة الأنسب.",correct:"الإجابة الصحيحة",why:"السبب",endtitle:"نتيجة الموديول الثاني",review:"المراجعة",complete:"تحديد كمكتمل",done:"اكتمل الموديول الثاني",replay:"العب مجدداً",tab1:"الموديول الأول – المقدمة",tab2:"الموديول الثاني – المراجعة",tab3:"التقييم الذاتي",tab4:"الموديول الثاني – أسئلة المدراء"}};
let lang="en",i=0,selected=null,checked=false,answers=Array(DATA.length).fill(null);
const E=id=>document.getElementById(id),tr=k=>T[lang][k];function show(id){for(const s of ["intro","quiz","end","done"])E(s).classList.toggle("hidden",s!==id);window.scrollTo(0,0)}
function paint(){document.documentElement.lang=lang;document.body.dir=lang==="ar"?"rtl":"ltr";E("lang").textContent=lang==="en"?"العربية":"English";for(const id of ["subtitle","tag","title","desc","method","start","back","endtitle","complete"])E(id).textContent=tr(id);E("theory").innerHTML=tr("theory");for(const n of ["tab1","tab2","tab3","tab4"])E(n).textContent=tr(n);E("doneTitle").textContent=tr("done");E("restart").textContent=tr("replay");if(!E("quiz").classList.contains("hidden"))render();if(!E("end").classList.contains("hidden"))results()}
function start(){i=0;selected=null;checked=false;answers=Array(DATA.length).fill(null);show("quiz");render()}
function render(){const q=DATA[i];E("counter").textContent=tr("q")+" "+(i+1)+" / 10";E("fill").style.width=((i+1)*10)+"%";E("scenario").textContent=q[lang==="ar"?"ar":"en"];E("question").textContent=tr("prompt");E("options").innerHTML="";q.options.forEach((opt,j)=>{const b=document.createElement("button");b.className="option"+(selected===j?" selected":"")+(checked&&j===q.correct?" right":"")+(checked&&j===selected&&selected!==q.correct?" wrong":"");b.textContent=String.fromCharCode(65+j)+") "+opt[lang==="ar"?1:0];b.disabled=checked;b.onclick=()=>{selected=j;render()};E("options").appendChild(b)});E("back").disabled=i===0;E("next").disabled=selected===null;E("next").textContent=checked?(i===9?tr("finish"):tr("next")):tr("check");E("feedback").classList.toggle("hidden",!checked);if(checked){E("feedback").innerHTML="";let b=document.createElement("b");b.textContent=selected===q.correct?tr("right"):tr("wrong");E("feedback").appendChild(b);for(const x of [tr("correct")+": "+String.fromCharCode(65+q.correct)+") "+q.options[q.correct][lang==="ar"?1:0],tr("why")+": "+q.why[lang==="ar"?1:0]]){let p=document.createElement("p");p.textContent=x;E("feedback").appendChild(p)}}}
function next(){if(selected===null)return;if(!checked){checked=true;answers[i]=selected;render();return}if(i===9){show("end");results()}else{i++;selected=answers[i];checked=selected!==null;render();E("motion").classList.remove("rise");void E("motion").offsetWidth;E("motion").classList.add("rise")}}
function results(){let n=answers.filter((a,j)=>a===DATA[j].correct).length;E("endtag").textContent=tr("tag");E("score").textContent=n+" / 10";E("resultmsg").textContent=lang==="ar"?"راجع الشروحات لتحدد كيف تختار الأسلوب المناسب للموقف.":"Review the explanations to choose the right response for the situation.";E("review").innerHTML="";DATA.forEach((q,j)=>{let d=document.createElement("div");d.className="summary";let p=document.createElement("b");p.textContent=(j+1)+". "+q[lang];d.appendChild(p);let note=document.createElement("p");note.textContent=(answers[j]===q.correct?"✓ ":"✕ ")+tr("correct")+": "+String.fromCharCode(65+q.correct)+" · "+q.why[lang==="ar"?1:0];d.appendChild(note);E("review").appendChild(d)})}
E("start").onclick=start;E("next").onclick=next;E("back").onclick=()=>{if(i>0){i--;selected=answers[i];checked=selected!==null;render()}};E("complete").onclick=()=>{show("done");E("doneText").textContent=lang==="ar"?"أكملت الأسئلة العشرة والتغذية الراجعة.":"You completed all 10 questions and the learning feedback."};E("restart").onclick=()=>{show("intro")};E("lang").onclick=()=>{lang=lang==="en"?"ar":"en";paint()};paint();
</script></body></html>
