<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYNC · Module 2</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;color:#092552;background:radial-gradient(circle at top right,#e1f2ff,transparent 38%),#f5f8fc}main{max-width:1040px;margin:auto;padding:22px 16px 60px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #44b1e7;padding:0 0 13px}.logo{font-size:36px;font-weight:1000}.logo span{color:#cb1231}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.lang{padding:10px 17px;background:white;color:#092552;border:2px solid #b7d9ed;border-radius:12px;font-weight:800}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;background:#e5f0fa;border:1px solid #bfd9f0;border-radius:16px;padding:8px;margin-top:16px}.nav a{padding:17px 10px;text-align:center;text-decoration:none;background:white;color:#0c386b;font-weight:850;border-radius:11px;line-height:1.3}.nav a.active{background:#092c67;color:white}.card{margin-top:20px;padding:clamp(20px,4vw,39px);background:#fff;border:1px solid #dce9f4;border-radius:24px;box-shadow:0 13px 39px #052c5311}.hidden{display:none!important}.pill{display:inline-block;border-radius:99px;background:#e7f4ff;color:#0969ae;padding:9px 14px;font-size:13px;font-weight:900}h1{font-size:clamp(32px,5vw,50px);margin:18px 0;line-height:1.13}h1 em{font-style:normal;color:#ce1332}h2{font-size:20px}p{line-height:1.65}.help{background:#eff8ff;border-left:5px solid #218fdf;border-radius:12px;padding:16px 18px;margin:17px 0}.primary{background:#092d69;color:white;border:0;padding:15px 25px;border-radius:12px;font-size:16px;font-weight:850}.primary:hover:not(:disabled){background:#c81031}.options{display:grid;gap:12px}.option{border:2px solid #d8e4f0;border-radius:13px;background:white;padding:15px 18px;text-align:start;color:#0b2c59;font-size:15px;font-weight:700;line-height:1.5}.option.selected{border-color:#146bc1;background:#e8f5ff}.option.right{border-color:#18985e;background:#edfff4}.option.wrong{border-color:#c31334;background:#fff0f3}.scenario{font-weight:850;font-size:clamp(19px,2.7vw,26px);line-height:1.5;margin:22px 0}.bar{background:#e4eef8;height:9px;border-radius:30px;margin:18px 0}.fill{background:#329de4;height:100%;border-radius:30px}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:20px}.score{font-size:70px;font-weight:1000}.summary{padding:15px;border:1px solid #dce9f3;border-radius:13px;margin:12px 0}.rise{animation:rise .35s ease-out}@keyframes rise{from{opacity:.2;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}body[dir=rtl] .help{border-left:0;border-right:5px solid #218fdf}@media(max-width:600px){.nav a{font-size:12px;padding:13px 6px}.row{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.rise{animation:none}}</style><style>.nav{grid-template-columns:repeat(4,minmax(0,1fr))}.nav a{font-size:clamp(11px,1.6vw,15px)}@media(max-width:500px){.nav{gap:4px;padding:5px}.nav a{padding:12px 3px;font-size:10px}}</style></head><body><main><header><div><div class="logo">SYNC<span>.</span></div><small id="subtitle">CONFLICT RESPONSE STYLES</small></div><button class="lang" id="lang">العربية</button></header><nav class="nav"><a href="../sync-conflict-detective/" id="tab1">01 · Module 1</a><a href="../sync-conflict-module2/" class="active" id="tab2" aria-current="page">02 · Module 2</a><a href="../sync-conflict-manager/" id="tab4">03 · Manager Area</a><a href="../sync-conflict-style/" id="tab3">04 · Self-Assessment</a></nav>

const DATA=[{"en":"During a Dar Al Dawa management meeting, Regulatory Affairs harshly criticizes Sales' proposal. The Sales Manager shuts the laptop, stays silent all day and ignores emails.","ar":"في اجتماع إداري بدار الدواء انتقد مدير الشؤون التنظيمية مقترح المبيعات بشدة. أغلق مدير المبيعات حاسوبه، ولزم الصمت طوال اليوم وتجاهل الرسائل.","options":[["An impulsive Flight response; pause, notice withdrawal and choose how to re-engage.","استجابة هروب اندفاعية؛ توقف ولاحظ الرغبة بالانسحاب واختر العودة للنقاش."],["An impulsive Fight response; notice an urge to attack and use Accommodating.","استجابة مواجهة اندفاعية؛ لاحظ الرغبة بالهجوم واستخدم المسايرة."],["Incorrect Collaborating; recognize high assertiveness and switch to Compromising.","تطبيق خاطئ للتعاون؛ لاحظ الحزم العالي وانتقل للتسوية."],["Incorrect Competing; recognize low cooperation and initially choose Avoiding.","تطبيق خاطئ للتنافس؛ لاحظ قلة التعاون واختر التجنب مؤقتاً."]],"correct":0,"why":["The reaction is withdrawal (Flight), not attack. Pause–Notice–Choose helps replace automatic shutdown with a deliberate response.","رد الفعل هو الانسحاب (الهروب) وليس الهجوم. تساعد خطوات توقف–لاحظ–اختر على استبدال الانسحاب التلقائي باستجابة واعية."]},{"en":"The BD Manager sees the Marketing Head leave a critical product-launch meeting early. Assuming Marketing does not care, the BD Manager angrily escalates a complaint without asking why.","ar":"رأى مدير تطوير الأعمال مدير التسويق يغادر اجتماع إطلاق منتج مهم مبكراً، فافترض أنه لا يهتم بالمشروع وصعّد شكوى غاضبة دون الاستفسار عن السبب.","options":[["Confused Story (lack of care) with Fact (leaving early); ask what happened.","خلط بين التفسير (عدم الاهتمام) والحقيقة (المغادرة المبكرة)؛ اسأل عما حدث."],["Used Accommodating on a strategic issue; switch immediately to Avoiding.","استخدم المسايرة في موضوع استراتيجي؛ انتقل مباشرة للتجنب."],["Confused Fact (lack of care) with Story (leaving early); require a compromise.","خلط بين الحقيقة (عدم الاهتمام) والتفسير (المغادرة)؛ افرض تسوية."],["Used Collaborating on a minor issue; shift to Competing.","استخدم التعاون في موضوع ثانوي؛ انتقل للتنافس."]],"correct":0,"why":["Leaving early is observable; the assumed lack of care is an interpretation. Verify the story before escalating.","المغادرة المبكرة واقعة يمكن ملاحظتها؛ أما عدم الاهتمام فهو تفسير. تحقق من التفسير قبل التصعيد."]},{"en":"Sales and Marketing have three weeks to finalize a new drug's promotion budget. To end their meeting quickly, they split it 50/50 without reviewing campaign needs.","ar":"لدى المبيعات والتسويق ثلاثة أسابيع لإنهاء ميزانية الترويج لدواء جديد. ولإنهاء الاجتماع سريعاً قسما الميزانية بالنصف دون فحص احتياجات الحملتين.","options":[["Collaborating was used under high urgency; switch to Competing for speed.","استُخدم التعاون في حالة عاجلة؛ الأفضل التنافس لحسم القرار سريعاً."],["Compromising was used despite available time; collaborate to assess real needs.","استُخدمت التسوية رغم توفر الوقت؛ الأفضل التعاون لفهم الاحتياجات الحقيقية."],["Accommodating protected harmony; use Avoiding to prevent later disputes.","حافظت المسايرة على الانسجام؛ استخدم التجنب لمنع الخلافات لاحقاً."],["Competing was used with limited resources; accommodate the stronger team.","استُخدم التنافس عند ندرة الموارد؛ ساير الفريق الأقوى."]],"correct":1,"why":["A quick equal split is Compromising. With three weeks available, Collaborating may uncover a better allocation based on actual needs.","التقسيم المتساوي السريع هو تسوية. ومع وجود ثلاثة أسابيع يمكن للتعاون كشف توزيع أفضل بناءً على الاحتياجات الفعلية."]},{"en":"Authorities mandate an immediate batch recall due to a printing error. The Regulatory Manager wants two hours of brainstorming with Sales before taking any action.","ar":"أصدرت الجهات الرقابية أمراً بسحب تشغيلة فوراً بسبب خطأ طباعة. يريد مدير الشؤون التنظيمية جلسة عصف ذهني لساعتين مع المبيعات قبل أي إجراء.","options":[["Collaborating is overused in an urgent crisis; take decisive action immediately.","هناك إفراط في التعاون أثناء أزمة عاجلة؛ اتخذ إجراءً حاسماً فوراً."],["Accommodating is overused in a crisis; avoid action and let Sales decide.","هناك إفراط في المسايرة؛ تجنب التصرف ودع المبيعات تقرر."],["Compromising is overused; accommodate the Regulatory team to keep calm.","هناك إفراط في التسوية؛ ساير فريق الشؤون التنظيمية لتهدئة الوضع."],["Competing is overused; collaborate to ensure every concern is heard first.","هناك إفراط في التنافس؛ تعاون أولاً لسماع الجميع."]],"correct":0,"why":["The recall is mandatory and urgent. Timely, directive Competing is appropriate for compliance and safety; discussion must not delay required action.","السحب إلزامي وعاجل. الحسم السريع مناسب لحماية السلامة والامتثال؛ ولا يجوز أن يؤخر النقاش الإجراء المطلوب."]},{"en":"A BD analyst repeatedly gives up project funding to Marketing's louder requests because they dislike tension and want the conversation to end.","ar":"يتنازل محلل في تطوير الأعمال مراراً عن تمويل مشروعه لصالح طلبات التسويق الأكثر إلحاحاً لأنه يكره التوتر ويريد إنهاء النقاش.","options":[["Overuses Accommodating on important issues; become more assertive and collaborate or compromise.","يفرط في المسايرة بموضوع مهم؛ يحتاج إلى مزيد من الحزم والتعاون أو التسوية."],["Overuses Competing on important issues; become more cooperative and avoid or accommodate.","يفرط في التنافس بموضوع مهم؛ يحتاج إلى تعاون أكبر والتجنب أو المسايرة."],["Overuses Avoiding; reduce assertiveness and accommodate or compromise.","يفرط في التجنب؛ قلل الحزم واستخدم المسايرة أو التسوية."],["Overuses Collaborating; cooperate less and compete or avoid.","يفرط في التعاون؛ قلل التعاون واتجه للتنافس أو التجنب."]],"correct":0,"why":["Repeatedly yielding on consequential funding is Accommodating. Important needs should also be voiced rather than surrendered automatically.","التنازل المتكرر عن تمويل مهم هو مسايرة. ينبغي التعبير عن الاحتياجات المهمة بدلاً من التنازل عنها تلقائياً."]},{"en":"Sales and Marketing argue over the main Dar Al Dawa conference room. Both keep saying, 'We booked it first; we need the room!' without making progress.","ar":"يتجادل فريقا المبيعات والتسويق حول القاعة الرئيسية بدار الدواء. يكرر كل فريق «حجزنا أولاً ونحتاج القاعة!» دون أي تقدم.","options":[["They argue over interests; raise voices until one side accommodates.","يتجادلون حول المصالح؛ ارفعوا الأصوات حتى يساير أحد الطرفين الآخر."],["They repeat positions; ask what each team specifically needs the room for.","يكررون المواقف المعلنة؛ اسألوا لماذا يحتاج كل فريق القاعة بالتحديد."],["They show low assertiveness and high cooperation; divide the time equally.","يظهرون حزماً ضعيفاً وتعاوناً عالياً؛ اقتسموا الوقت بالتساوي."],["They misuse Pause–Notice–Choose; ask only who is technically entitled by policy.","يسيئون استخدام توقف–لاحظ–اختر؛ اسألوا فقط من يحق له الحجز وفق السياسة."]],"correct":1,"why":["'We booked first' is a position. Asking why each needs the room reveals underlying interests and may open alternatives.","«حجزنا أولاً» موقف معلن. السؤال عن سبب الحاجة للقاعة يكشف المصلحة الأساسية وقد يفتح خيارات أخرى."]},{"en":"A Regional Sales Manager insists on winning an argument over the exact blue shade in a minor internal memo footer, delaying the memo two days.","ar":"يصر مدير مبيعات إقليمي على الفوز بجدال حول درجة اللون الأزرق في تذييل مذكرة داخلية بسيطة، ما يؤخرها يومين.","options":[["Competing is excessive for a trivial issue; Accommodating or Avoiding may fit.","التنافس مبالغ فيه في موضوع بسيط؛ قد تلائم المسايرة أو التجنب."],["Avoiding is inappropriate for a trivial issue; use Collaborating or Competing.","التجنب غير مناسب في موضوع بسيط؛ استخدم التعاون أو التنافس."],["Collaborating is excessive for a trivial issue; use Compromising or Competing.","التعاون مبالغ فيه في موضوع بسيط؛ استخدم التسوية أو التنافس."],["Accommodating is excessive for a trivial issue; use Avoiding or Collaborating.","المسايرة مبالغ فيها في موضوع بسيط؛ استخدم التجنب أو التعاون."]],"correct":0,"why":["The issue is low stakes, so forcing a win wastes time. Accommodating or stepping away can preserve focus on higher priorities.","الموضوع منخفض الأهمية، والإصرار على الفوز يهدر الوقت. قد تكون المسايرة أو الابتعاد أفضل لحماية الأولويات."]},{"en":"While presenting medication information to doctors, a medical representative receives a harsh side-effect question and goes blank, staring silently for 30 seconds.","ar":"أثناء تقديم معلومات دوائية للأطباء، يتلقى مندوب طبي سؤالاً حاداً عن الأعراض الجانبية ويتجمد مكانه وينظر بصمت لمدة 30 ثانية.","options":[["Flight response; notice the urge to attack and defend aggressively.","استجابة هروب؛ لاحظ الرغبة بالهجوم ودافع بشدة."],["Fight response; notice the urge to escape and leave the presentation.","استجابة مواجهة؛ لاحظ الرغبة بالهرب وغادر العرض."],["Freeze response; notice the shutdown, breathe, and ask for clarification.","استجابة تجمد؛ لاحظ التوقف الذهني وتنفس واطلب توضيح السؤال."],["Freeze response; breathe, then accommodate the doctor's position forcefully.","استجابة تجمد؛ تنفس ثم ساير موقف الطبيب بقوة."]],"correct":2,"why":["Going blank is Freeze. A pause, breath and clarification request help restore a thoughtful and professionally appropriate response.","التوقف الذهني يمثل التجمد. التوقف والتنفس وطلب التوضيح يساعد على استعادة استجابة مهنية مدروسة."]},{"en":"Regulatory Affairs and Commercial disagree fundamentally on a critical drug-registration strategy. They avoid speaking to each other for a month, hoping it resolves itself.","ar":"تختلف الشؤون التنظيمية والإدارة التجارية جذرياً حول استراتيجية تسجيل دواء مهم. يتجنب الطرفان الحديث لشهر آملين أن تُحل المشكلة وحدها.","options":[["Collaborating is overused on a minor issue; switch to Compromising.","هناك إفراط في التعاون بموضوع بسيط؛ انتقل للتسوية."],["Accommodating is overused on a strategic issue; switch to Competing.","هناك إفراط في المسايرة بموضوع استراتيجي؛ انتقل للتنافس."],["Avoiding is overused on a critical issue; collaborate to resolve it.","هناك إفراط في التجنب بموضوع بالغ الأهمية؛ تعاونوا لحلّه."],["Competing is overused on a minor issue; switch to Accommodating.","هناك إفراط في التنافس بموضوع بسيط؛ انتقل للمسايرة."]],"correct":2,"why":["Long-term avoidance cannot solve an important strategic disagreement. Collaborating helps both functions examine needs and reach a workable decision.","التجنب الطويل لا يحل خلافاً استراتيجياً مهماً. التعاون يساعد الجهتين على فهم الاحتياجات والتوصل لقرار عملي."]},{"en":"An argument between the Sales Manager and QA Supervisor becomes heated. QA says, 'I will step away to cool down; we will resume tomorrow morning.'","ar":"يشتد النقاش بين مدير المبيعات ومشرف ضمان الجودة. يقول المشرف: «سأبتعد حتى أهدأ، ونستكمل الحديث صباح الغد».","options":[["Poor Avoiding; all conflicts require immediate Competing.","تجنب غير مناسب؛ كل خلاف يتطلب الحسم الفوري."],["Poor Accommodating; both must continue collaborating despite high emotion.","مسايرة غير مناسبة؛ يجب مواصلة التعاون رغم شدة الانفعال."],["Appropriate short-term Avoiding; emotions are high and a restart is scheduled.","تجنب مؤقت مناسب؛ المشاعر مرتفعة وهناك موعد محدد لاستئناف النقاش."],["Appropriate Compromising; stepping away splits the emotional burden.","تسوية مناسبة؛ الابتعاد يقسم العبء العاطفي بالتساوي."]],"correct":2,"why":["A time-limited break can be a constructive Avoiding response: it lowers emotion without abandoning the issue.","قد يكون الابتعاد المؤقت أسلوب تجنب بنّاء: يهدئ المشاعر دون التخلي عن المشكلة."]}];
const T={en:{subtitle:"CONFLICT RESPONSE STYLES",tag:"MODULE 2 · 10 SCENARIOS",title:"Module 2: Conflict Response Styles",desc:"This module moves from why conflict happens to how we respond. Learn to recognize automatic reactions and deliberately choose an appropriate response.",theory:"<b>Pause → Notice → Choose:</b> Stop your first reaction, notice your thoughts and feelings, and select a considered response.<br><b>Fact vs Story:</b> Separate observable facts from assumptions.<br><b>Five styles:</b> Competing, Avoiding, Accommodating, Compromising, and Collaborating. No style is always best: urgency, importance and available time matter.",method:"Answer 10 workplace scenarios. Each question tests the best diagnosis and correction. You will see teaching feedback immediately after each answer. No timer.",start:"Start Module 2",q:"Question",prompt:"Which option best identifies the mistake and appropriate response?",check:"Check answer",next:"Next question",finish:"See results",back:"Back",right:"Correct!",wrong:"Not quite.",correct:"Correct answer",why:"Why?",endtitle:"Module 2 Results",review:"Review",complete:"Mark as Complete",done:"Module 2 completed",replay:"Play again",tab1:"01 · Module 1",tab2:"02 · Module 2",tab3:"04 · Self-Assessment",tab4:"03 · Manager Area"},ar:{subtitle:"أنماط الاستجابة للخلاف",tag:"الموديول الثاني · ١٠ مواقف",title:"الموديول الثاني: أساليب الاستجابة للخلاف",desc:"ينتقل هذا الموديول من فهم أسباب الخلاف إلى كيفية الاستجابة له، وكيف نلاحظ ردود فعلنا التلقائية ونختار استجابة مناسبة.",theory:"<b>توقف ← لاحظ ← اختر:</b> أوقف رد الفعل الأول، لاحظ أفكارك ومشاعرك، ثم اختر استجابة واعية.<br><b>الحقيقة والتفسير:</b> ميّز بين المعلومة الملاحظة والافتراض.<br><b>الأساليب الخمسة:</b> التنافس، والتجنب، والمسايرة، والتسوية، والتعاون. لا يوجد أسلوب أفضل دائماً؛ يعتمد الاختيار على الإلحاح والأهمية والوقت.",method:"أجب عن ١٠ مواقف من بيئة العمل، وحدد التشخيص والتصرف الأنسب. تظهر التغذية الراجعة بعد كل إجابة، ولا يوجد مؤقت.",start:"ابدأ الموديول الثاني",q:"السؤال",prompt:"أي خيار يحدد الخطأ وأفضل طريقة لتصحيحه؟",check:"تحقق من الإجابة",next:"السؤال التالي",finish:"عرض النتائج",back:"السابق",right:"إجابة صحيحة!",wrong:"ليست الإجابة الأنسب.",correct:"الإجابة الصحيحة",why:"السبب",endtitle:"نتيجة الموديول الثاني",review:"المراجعة",complete:"تحديد كمكتمل",done:"اكتمل الموديول الثاني",replay:"العب مجدداً",tab1:"٠١ · الموديول الأول",tab2:"٠٢ · الموديول الثاني",tab3:"٠٤ · التقييم الذاتي",tab4:"٠٣ · منطقة المدير"}};
let lang="en",i=0,selected=null,checked=false,answers=Array(DATA.length).fill(null);
const E=id=>document.getElementById(id),tr=k=>T[lang][k];function show(id){for(const s of ["intro","quiz","end","done"])E(s).classList.toggle("hidden",s!==id);window.scrollTo(0,0)}
function paint(){document.documentElement.lang=lang;document.body.dir=lang==="ar"?"rtl":"ltr";E("lang").textContent=lang==="en"?"العربية":"English";for(const id of ["subtitle","tag","title","desc","method","start","back","endtitle","complete"])E(id).textContent=tr(id);E("theory").innerHTML=tr("theory");for(const n of ["tab1","tab2","tab3","tab4"])E(n).textContent=tr(n);E("doneTitle").textContent=tr("done");E("restart").textContent=tr("replay");if(!E("quiz").classList.contains("hidden"))render();if(!E("end").classList.contains("hidden"))results()}
function start(){i=0;selected=null;checked=false;answers=Array(DATA.length).fill(null);show("quiz");render()}
function render(){const q=DATA[i];E("counter").textContent=tr("q")+" "+(i+1)+" / 10";E("fill").style.width=((i+1)*10)+"%";E("scenario").textContent=q[lang==="ar"?"ar":"en"];E("question").textContent=tr("prompt");E("options").innerHTML="";q.options.forEach((opt,j)=>{const b=document.createElement("button");b.className="option"+(selected===j?" selected":"")+(checked&&j===q.correct?" right":"")+(checked&&j===selected&&selected!==q.correct?" wrong":"");b.textContent=String.fromCharCode(65+j)+") "+opt[lang==="ar"?1:0];b.disabled=checked;b.onclick=()=>{selected=j;render()};E("options").appendChild(b)});E("back").disabled=i===0;E("next").disabled=selected===null;E("next").textContent=checked?(i===9?tr("finish"):tr("next")):tr("check");E("feedback").classList.toggle("hidden",!checked);if(checked){E("feedback").innerHTML="";let b=document.createElement("b");b.textContent=selected===q.correct?tr("right"):tr("wrong");E("feedback").appendChild(b);for(const x of [tr("correct")+": "+String.fromCharCode(65+q.correct)+") "+q.options[q.correct][lang==="ar"?1:0],tr("why")+": "+q.why[lang==="ar"?1:0]]){let p=document.createElement("p");p.textContent=x;E("feedback").appendChild(p)}}}
function next(){if(selected===null)return;if(!checked){checked=true;answers[i]=selected;render();return}if(i===9){show("end");results()}else{i++;selected=answers[i];checked=selected!==null;render();E("motion").classList.remove("rise");void E("motion").offsetWidth;E("motion").classList.add("rise")}}
function results(){let n=answers.filter((a,j)=>a===DATA[j].correct).length;E("endtag").textContent=tr("tag");E("score").textContent=n+" / 10";E("resultmsg").textContent=lang==="ar"?"راجع الشروحات لتحدد كيف تختار الأسلوب المناسب للموقف.":"Review the explanations to choose the right response for the situation.";E("review").innerHTML="";DATA.forEach((q,j)=>{let d=document.createElement("div");d.className="summary";let p=document.createElement("b");p.textContent=(j+1)+". "+q[lang];d.appendChild(p);let note=document.createElement("p");note.textContent=(answers[j]===q.correct?"✓ ":"✕ ")+tr("correct")+": "+String.fromCharCode(65+q.correct)+" · "+q.why[lang==="ar"?1:0];d.appendChild(note);E("review").appendChild(d)})}
E("start").onclick=start;E("next").onclick=next;E("back").onclick=()=>{if(i>0){i--;selected=answers[i];checked=selected!==null;render()}};E("complete").onclick=()=>{show("done");E("doneText").textContent=lang==="ar"?"أكملت الأسئلة العشرة والتغذية الراجعة.":"You completed all 10 questions and the learning feedback."};E("restart").onclick=()=>{show("intro")};E("lang").onclick=()=>{lang=lang==="en"?"ar":"en";paint()};paint();
</script></body></html>
