<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYNC · Role Play B</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;color:#001B4D;font-family:Poppins,'Noto Sans Arabic',Arial,sans-serif;background:radial-gradient(circle at 95% 0%,#e5f7fd,transparent 40%),#f4f8fc}main{max-width:1050px;padding:24px 17px 65px;margin:auto}header{direction:ltr;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-bottom:4px solid #48BAE2;padding-bottom:14px}.logo{font-weight:900;letter-spacing:-1.5px;font-size:36px;line-height:1.12}.logo span{color:#A53430}header small{display:block;font-size:12px;font-weight:700;color:#54708f;letter-spacing:.04em;margin-top:8px}.lang{background:white;color:#001B4D;border:1.5px solid #b5d6e9;border-radius:12px;padding:11px 17px;font:700 15px inherit;cursor:pointer}.tab-heading{direction:ltr;margin:18px 0 13px;font-size:12px;font-weight:800;letter-spacing:.075em;color:#53749b}.tabs{direction:ltr;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;background:#e9f3fa;border:1px solid #c8e0f0;border-radius:15px;padding:7px}.tabs a{display:flex;align-items:center;justify-content:center;text-align:center;background:white;color:#001B4D;text-decoration:none;font-size:clamp(9px,1.12vw,12px);font-weight:700;line-height:1.4;border:1px solid #d6e8f3;border-radius:10px;padding:11px 5px;min-height:65px}.tabs a.active{background:#001B4D;color:white;border-color:#001B4D}.card{border-radius:22px;border:1px solid #d7e6f3;background:white;box-shadow:0 14px 32px #001b4d12;padding:clamp(20px,4vw,38px);margin-top:23px}.hidden{display:none!important}h1{font-size:clamp(29px,5vw,48px);line-height:1.15;margin:10px 0 17px}h2{font-size:23px}p{line-height:1.75}.pill{display:inline-block;background:#e8f6fc;color:#12668e;border-radius:50px;padding:9px 14px;font-size:12px;font-weight:800}.warning{background:#fff1f1;color:#8d2032;padding:14px 17px;border-left:5px solid #A53430;border-radius:12px;font-weight:700}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.case-tab{border:2px solid #d2e4f0;background:#fff;color:#001B4D;font-family:inherit;font-weight:800;border-radius:12px;padding:17px 10px;cursor:pointer}.case-tab.active{background:#001B4D;color:white;border-color:#001B4D}.panel{background:#f2f9fe;border:1px solid #d6e8f3;border-radius:15px;padding:17px 19px;margin:14px 0}.panel strong{display:block;margin-bottom:7px;color:#0c4c85}.panel.secret{background:#fff8f5;border-color:#edd1c6}.panel.secret strong{color:#993d30}.button{background:#001B4D;color:white;font-family:inherit;font-weight:800;border:0;padding:15px 24px;border-radius:12px;cursor:pointer}.button:hover{background:#A53430}.quiet{background:#eaf5fa;color:#001B4D}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:7px}textarea{width:100%;min-height:88px;resize:vertical;border:2px solid #d4e5f1;background:white;border-radius:12px;padding:12px 15px;font-family:inherit;font-size:14px;color:#001B4D}textarea:focus,input:focus{outline:3px solid #b7eaff;border-color:#239cd4}input{border:2px solid #cadfed;border-radius:12px;padding:15px;font-size:18px;width:100%;max-width:340px}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.muted{font-size:13px;color:#527491}.progress{font-weight:700;color:#447395}.rise{animation:rise .35s ease-out}@keyframes rise{from{opacity:.3;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}body[dir=rtl] .warning{border-left:0;border-right:5px solid #A53430}@media(max-width:700px){.tabs{grid-template-columns:repeat(3,1fr)}.roles{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.rise{animation:none}}
</style><style id="sync-role-shortcuts-style">.sync-role-fixed{position:fixed!important;right:14px;top:13px;z-index:9999;display:flex;gap:7px;direction:ltr;padding:5px;background:#e7f4fc;border:1px solid #bcd8eb;border-radius:13px;box-shadow:0 5px 15px #001b4d1a}.sync-role-fixed a{font-family:Poppins,Arial,sans-serif!important;font-size:12px!important;font-weight:800!important;text-decoration:none!important;color:#001b4d!important;background:white!important;border-radius:9px!important;padding:11px 10px!important;white-space:nowrap}.sync-role-fixed a[aria-current="page"]{background:#001b4d!important;color:white!important}.sync-role-fixed a:hover{background:#d8effb!important;color:#001b4d!important}.sync-role-fixed a:focus-visible{outline:3px solid #a53430}.sync-role-fixed~main header{padding-right:222px!important;min-height:78px!important}@media(max-width:640px){.sync-role-fixed{right:9px;top:8px;gap:4px;padding:4px}.sync-role-fixed a{font-size:10px!important;padding:9px 6px!important}.sync-role-fixed~main header{padding-right:152px!important}}</style></head><body><aside class="sync-role-fixed" aria-label="Role play shortcuts"><a href="../sync-conflict-role-a/" >Role Play A</a><a href="../sync-conflict-role-b/" aria-current="page">Role Play B</a></aside><main><header><div><div class="logo">SYNC<span>.</span></div><small>WORKPLACE CONFLICT LAB</small></div><button class="lang" id="langBtn">العربية</button></header><div class="tab-heading">CHOOSE YOUR ACTIVITY</div><nav class="tabs"><a href="../sync-conflict-detective/" id="tab1" >Module 1 – Introduction</a><a href="../sync-conflict-module2/" id="tab2" >Module 2 – Review</a><a href="../sync-conflict-manager/" id="tab3" >Module 2 – Manager Questions</a><a href="../sync-conflict-style/" id="tab4" >Self-Assessment</a></nav><section id="gate" class="card"><span class="pill">ROLE PLAY B</span><h1 id="gateTitle">Role Play B</h1><p id="gateText"></p><form id="unlockForm"><label id="passLabel" for="pwd">Enter password</label><div class="actions" style="margin-top:10px"><input id="pwd" type="password" autocomplete="off" required maxlength="30"><button type="submit" class="button" id="unlockBtn">Unlock</button></div><p id="error" role="alert" class="warning hidden"></p></form></section><section id="room" class="card hidden"><div class="actions" style="justify-content:space-between"><div><span class="pill">ROLE PLAY B</span><h1 id="roomTitle">Participant B</h1></div><button class="button quiet" id="lockBtn">Lock role</button></div><p class="warning" id="warning"></p><p id="welcome"></p><div class="roles" id="cases"></div><div class="rise" id="details"><h2 id="caseTitle"></h2><p class="progress" id="roleName"></p><div id="roleFields"></div><h2 id="prepTitle"></h2><p class="muted" id="prepLede"></p><div id="prepFields"></div><div class="actions"><button class="button" id="copy" type="button">Copy preparation</button><span class="muted" id="saved"></span></div></div></section></main><script>
const ROLE="b",CASES=[{"name":"THE PRODUCT LAUNCH DEADLOCK","arName":"مأزق إطلاق المنتج","en":{"role":"Commercial / Sales Director","public":"The company is launching a new, highly anticipated product. You are meeting with the Operations Manager to finalize the launch date.","position":"Demand that the product launches this Monday as originally planned. Insist that another delay would make the whole project a failure.","interest":"You have industry information that your biggest competitor will launch a similar product next Friday. If you do not launch first, you may lose the first-to-market advantage and your sales team will lose their quarterly bonuses. You are protecting the team's rewards and your leadership standing.","assumption":"You assume the Operations Manager is a slow, bureaucratic micromanager afraid to act and hiding behind paperwork.","instruction":"Argue strongly for Monday. Do not initially reveal the competitor information or team bonuses. Reveal them only if your partner stops calling you reckless and asks why Monday is so important."},"ar":{"role":"المدير التجاري / مدير المبيعات","public":"تستعد الشركة لإطلاق منتج جديد مرتقب. تجتمع مع مدير العمليات لتحديد موعد الإطلاق.","position":"تطلب إطلاق المنتج هذا الاثنين كما خُطط له، وتصر على أن أي تأخير إضافي يعني فشل المشروع.","interest":"لديك معلومات عن إطلاق منافس منتجاً مشابهاً الجمعة المقبلة. التأخير سيضيع أسبقية السوق وقد يخسر فريق المبيعات مكافآته الفصلية. تريد حماية مكافآت فريقك ومكانتك كقائد ناجح.","assumption":"تفترض أن مدير العمليات بيروقراطي وبطيء ويختبئ خلف الإجراءات لأنه يخشى القرار.","instruction":"دافع بقوة عن موعد الاثنين. لا تكشف معلومات المنافس أو المكافآت أولاً. اكشفها عندما يسألك الطرف الآخر بهدوء لماذا هذا الموعد مهم."}},{"name":"THE TRAINING BUDGET BATTLE","arName":"معركة ميزانية التدريب","en":{"role":"Regional Sales Manager","public":"At financial year end, $20,000 remains in the department budget. If unused by next week, it will be taken back. You meet the L&D Manager to decide how to spend it.","position":"Demand that all $20,000 fund a three-day offsite sales-team training retreat at a good hotel, such as the Dead Sea.","interest":"The team missed sales targets in two consecutive quarters, morale is extremely low, and two top performers have threatened to resign. You need team-building and intensive coaching to prevent the team from falling apart.","assumption":"You assume the L&D Manager is tech-obsessed, hides behind a computer screen, and does not understand the psychological pressures of field sales.","instruction":"Argue hard for the retreat. Do not initially reveal the resignation threats. Reveal the risk of team collapse only if the L&D Manager stops pushing software and asks why the retreat is so urgent."},"ar":{"role":"مدير المبيعات الإقليمي","public":"بقيت 20 ألف دولار من ميزانية نهاية السنة. إذا لم تُصرف قبل الأسبوع المقبل ستُسحب. تجتمع مع مدير التعلم والتطوير لاتخاذ قرار.","position":"تطلب إنفاق المبلغ كاملاً على معسكر تدريبي خارجي لثلاثة أيام في فندق جيد مثل البحر الميت.","interest":"فشل الفريق في تحقيق الأهداف لفصلين متتاليين، ومعنوياته منخفضة جداً، وهدد اثنان من أفضل أفراده بالاستقالة. تحتاج تدخلاً تدريبياً وتحفيزياً لإنقاذ الفريق.","assumption":"تفترض أن مدير التعلم والتطوير مولع بالتقنية ولا يفهم الضغوط النفسية التي يعيشها فريق الميدان.","instruction":"دافع بقوة عن المعسكر. لا تكشف تهديدات الاستقالة أولاً، بل تحدث عنها عندما يسألك الطرف الآخر عن سبب الحاجة الملحة للمعسكر."}},{"name":"THE PERFORMANCE RATING DILEMMA","arName":"معضلة تقييم الأداء","en":{"role":"HR / Talent Business Partner","public":"It is the annual performance evaluation cycle. You meet a Department Head to finalize the team ratings.","position":"Demand that at least three of the five ratings be lowered to Average or Good. Insist on following the normal distribution guideline rather than rating everyone Excellent.","interest":"The CEO confidentially said the company missed revenue targets and the overall bonus budget was cut by 40%. Granting everyone Excellent would exhaust the bonus pool and leave other employees with no bonus. You are protecting financial stability and organization-wide fairness.","assumption":"You assume the Department Head is afraid to give honest constructive feedback or hold difficult conversations.","instruction":"Start by enforcing the rating policy. Do not initially reveal the confidential 40% bonus-budget cut. Reveal it only if the Department Head stops demanding maximum payouts and tries to understand your constraints."},"ar":{"role":"شريك أعمال الموارد البشرية / المواهب","public":"في دورة تقييم الأداء السنوي، تجتمع مع رئيس القسم لاعتماد تقييمات فريقه.","position":"تطالب بتخفيض تقييمات ثلاثة موظفين على الأقل إلى متوسط أو جيد والالتزام بتوزيع التقييمات المعتمد.","interest":"أخبرك الرئيس التنفيذي بسرية أن الشركة لم تحقق أهداف الإيرادات وأن ميزانية المكافآت خُفضت 40%. إذا مُنح الجميع ممتاز ستنفد الميزانية وقد يُحرم باقي الموظفين من المكافآت؛ وتحمي العدالة والاستقرار المالي.","assumption":"تفترض أن رئيس القسم يخشى إعطاء ملاحظات صريحة أو خوض محادثات صعبة.","instruction":"ابدأ بتطبيق سياسة التقييم. لا تكشف خفض الميزانية السري فوراً؛ اكشفه فقط إذا حاول رئيس القسم فهم قيودك بدلاً من المطالبة بالمكافآت القصوى."}},{"name":"THE HYBRID WORK CLASH","arName":"الخلاف حول العمل الهجين","en":{"role":"Lead Data Analyst","public":"You work on a critical project with a deadline in four weeks. You meet the Project Lead to discuss your work schedule.","position":"Demand to work entirely from home for the next month. Insist you cannot commute to the office during this period.","interest":"Your elderly mother has just undergone surgery, and you are her primary caregiver. You need to be home to give her medication during the day, but plan to do deep data work late at night. You want to protect your family while keeping your job and delivering the project.","assumption":"You assume the Project Lead is a toxic micromanager who does not trust you or care about your personal life.","instruction":"Argue strongly for working from home. Keep your mother's health private initially. Reveal your caregiving situation and willingness to work at night only if the Project Lead asks sincerely about your circumstances."},"ar":{"role":"محلل البيانات الرئيسي","public":"تعمل على مشروع حاسم موعد تسليمه بعد أربعة أسابيع، وتجتمع مع قائد المشروع بشأن جدول عملك.","position":"تطالب بالعمل من المنزل بالكامل طوال الشهر المقبل، وتصر على أنك لا تستطيع التنقل للمكتب حالياً.","interest":"خضعت والدتك المسنة لعملية جراحية وأنت المسؤول الأساسي عن رعايتها وإعطائها الدواء نهاراً. تنوي العمل ليلاً في تحليل البيانات دون مشتتات، وتريد حماية أسرتك ووظيفتك.","assumption":"تفترض أن قائد المشروع مدير متسلط لا يثق بك ولا يهتم بحياتك الشخصية بل برؤيتك على المكتب.","instruction":"دافع بقوة عن العمل من المنزل. لا تكشف أزمة والدتك الصحية فوراً لأنها خاصة؛ اكشفها مع استعدادك للعمل ليلاً إذا سألك قائد المشروع باهتمام حقيقي عن ظروفك."}}],LANG={"en":{"heading":"ROLE PLAY","prompt":"Private role-play card. Do not show your partner.","title":"Case","public":"The Public Situation","position":"Your Position (What you will demand)","interest":"Your Secret Interest (Why you really need this)","assumption":"Your Mindset & Assumption","instruction":"Your Instruction","prep":"PARTICIPANT PREPARATION SHEET","preplede":"Complete individually before the role-play. Your answers stay on this device unless you choose to copy them.","self":"1. Self-Awareness · Look Inward","other":"2. Analyze the Other Side · Look Outward","plan":"3. Plan the Conversation · The 5 Principles","questions":["What is my stated Position (what am I asking for)?","What is my real Interest (why do I need this, and what am I protecting)?","What do I guess their Position will be?","What might their hidden Interest or fear be? Put yourself in their shoes.","Separate People from the Problem: What respectful question can I ask?","Common Ground: What shared goal do we probably both agree on?","Mutual Gain: What creative compromise or alternative could meet both needs?"],"save":"Preparation saved on this device","copy":"Copy preparation","copied":"Preparation copied","lock":"Role Play","pass":"Enter password","unlock":"Unlock","error":"Incorrect password. Please try again.","exit":"Lock role","welcome":"Choose a case and review your confidential role card, then complete your preparation sheet.","guidance":"The role cards include information your partner must not see. Use separate devices and avoid sharing your screen.","tabs":["Module 1 – Introduction","Module 2 – Review","Module 2 – Manager Questions","Self-Assessment","Role Play A","Role Play B"]},"ar":{"heading":"لعب الأدوار","prompt":"بطاقة دور سرّية. لا تعرضها على شريكك.","title":"الحالة","public":"الموقف العلني","position":"موقفك المعلن (ما الذي ستطلبه؟)","interest":"مصلحتك السرية (لماذا تحتاج هذا؟)","assumption":"افتراضاتك وطريقة تفكيرك","instruction":"تعليمات الدور","prep":"ورقة تحضير المشارك","preplede":"املأ الورقة بشكل فردي قبل لعب الدور. تُحفظ الإجابات على هذا الجهاز فقط، ويمكنك نسخها.","self":"١. الوعي الذاتي · انظر إلى الداخل","other":"٢. تحليل الطرف الآخر · انظر إلى الخارج","plan":"٣. تخطيط الحوار · المبادئ الخمسة","questions":["ما موقفي المعلن؟ ماذا أطلب؟","ما مصلحتي الحقيقية؟ لماذا أحتاج هذا وما الذي أحميه؟","ما الذي أتوقع أن يكون موقف الطرف الآخر؟","ما المصلحة أو المخاوف الخفية التي ربما لديه؟ ضع نفسك مكانه.","افصل الأشخاص عن المشكلة: ما السؤال المحترم الذي يمكنني طرحه لفهم الطرف الآخر؟","الأرضية المشتركة: ما الهدف الكبير الذي نتفق عليه غالباً؟","المكسب المتبادل: ما التسوية المبتكرة أو الحل البديل الذي قد يلبي احتياجات الطرفين؟"],"save":"تم حفظ التحضير على هذا الجهاز","copy":"نسخ التحضير","copied":"تم نسخ التحضير","lock":"لعب الأدوار","pass":"أدخل كلمة المرور","unlock":"فتح","error":"كلمة المرور غير صحيحة. حاول مرة أخرى.","exit":"قفل الدور","welcome":"اختر الحالة واقرأ بطاقتك السرية ثم أكمل ورقة التحضير.","guidance":"تحتوي البطاقات على معلومات لا ينبغي لشريكك الاطلاع عليها. استخدما جهازين منفصلين ولا تشاركا الشاشة.","tabs":["الموديول الأول – المقدمة","الموديول الثاني – المراجعة","الموديول الثاني – أسئلة المدراء","التقييم الذاتي","لعب الأدوار A","لعب الأدوار B"]}};let language="en",current=0,open=false;
const el=id=>document.getElementById(id),tx=k=>LANG[language][k],locale=obj=>obj[language];
function render(){document.documentElement.lang=language;document.body.dir=language==="ar"?"rtl":"ltr";el("langBtn").textContent=language==="en"?"العربية":"English";LANG[language].tabs.forEach((x,i)=>{const tab=el("tab"+(i+1));if(tab)tab.textContent=x;});el("gateTitle").textContent=tx("heading")+" "+ROLE.toUpperCase();el("gateText").textContent=tx("guidance");el("passLabel").textContent=tx("pass");el("unlockBtn").textContent=tx("unlock");el("lockBtn").textContent=tx("exit");el("warning").textContent=tx("prompt");el("welcome").textContent=tx("welcome");el("roomTitle").textContent=language==="ar"?"المشارك "+ROLE.toUpperCase():"Participant "+ROLE.toUpperCase();el("prepTitle").textContent=tx("prep");el("prepLede").textContent=tx("preplede");el("copy").textContent=tx("copy");if(open)renderCase()}
function key(){return "sync.role."+ROLE+".case."+current}
function store(){const answers=[...el("prepFields").querySelectorAll("textarea")].map(e=>e.value);try{localStorage.setItem(key(),JSON.stringify(answers))}catch{}el("saved").textContent=tx("save")}
function renderCase(){const item=CASES[current],card=locale(item),names=["public","position","interest","assumption","instruction"];el("cases").innerHTML="";CASES.forEach((c,i)=>{const b=document.createElement("button");b.className="case-tab"+(i===current?" active":"");b.textContent=(language==="en"?"Case ":"الحالة ")+(i+1);b.onclick=()=>{current=i;renderCase()};el("cases").appendChild(b)});el("caseTitle").textContent=(language==="en"?"CASE ":"الحالة ")+(current+1)+": "+(language==="en"?item.name:item.arName);el("roleName").textContent=language==="en"?"Role Card: Employee "+ROLE.toUpperCase()+" ("+card.role+")":"بطاقة الدور: المشارك "+ROLE.toUpperCase()+" ("+card.role+")";el("roleFields").innerHTML="";names.forEach(k=>{const box=document.createElement("div");box.className="panel"+(k==="interest"?" secret":"");const title=document.createElement("strong");title.textContent=tx(k);const para=document.createElement("p");para.textContent=card[k];box.append(title,para);el("roleFields").appendChild(box)});let past=[];try{past=JSON.parse(localStorage.getItem(key())||"[]")}catch{}el("prepFields").innerHTML="";tx("questions").forEach((q,j)=>{if(j===0||j===2||j===4){const h=document.createElement("h2");h.textContent=tx(j===0?"self":j===2?"other":"plan");el("prepFields").appendChild(h)}const div=document.createElement("div");div.className="field";const label=document.createElement("label");label.textContent=q;label.setAttribute("for","field"+j);const area=document.createElement("textarea");area.id="field"+j;area.value=past[j]||"";area.addEventListener("input",store);div.append(label,area);el("prepFields").appendChild(div)});el("saved").textContent="";const m=el("details");m.classList.remove("rise");void m.offsetWidth;m.classList.add("rise")}
el("unlockForm").onsubmit=e=>{e.preventDefault();if(el("pwd").value.trim().toLowerCase()!==ROLE){el("error").textContent=tx("error");el("error").classList.remove("hidden");return}el("error").classList.add("hidden");el("pwd").value="";open=true;el("gate").classList.add("hidden");el("room").classList.remove("hidden");render();window.scrollTo(0,0)};
el("lockBtn").onclick=()=>{open=false;el("gate").classList.remove("hidden");el("room").classList.add("hidden");el("pwd").value="";window.scrollTo(0,0)};
el("copy").onclick=()=>{const c=CASES[current];const output=[tx("heading")+" "+ROLE.toUpperCase(),c.name,tx("prep"),...tx("questions").map((q,j)=>q+"\n"+(el("field"+j).value||""))].join("\n\n");navigator.clipboard?.writeText(output).then(()=>{el("saved").textContent=tx("copied")}).catch(()=>{el("saved").textContent=tx("save")})};
el("langBtn").onclick=()=>{language=language==="en"?"ar":"en";render()};render();
</script></body></html>
